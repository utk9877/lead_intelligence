[project]
name = "li-api"
version = "0.1.0"
description = "Internal FastAPI over the company graph"
requires-python = ">=3.12"
dependencies = [
    "li-core",
    "li-db",
    "li-telemetry",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[tool.uv.sources]
li-core = { workspace = true }
li-db = { workspace = true }
li-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/li_api"]
